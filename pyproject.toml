[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "midstream-core"
version = "0.1.0"
requires-python = ">=3.12"
license = "GPL-3.0-only"

[project.scripts]
midstream = "midstream.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
midstream = ["data/TSCharacters.txt", "data/LICENSE-OpenCC"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
